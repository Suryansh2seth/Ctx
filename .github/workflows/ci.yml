name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  msrv:
    name: MSRV Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Check the optional `exact` feature still compiles
        run: cargo check --features exact --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Report release binary size (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            size=$(stat -f%z target/release/ctx)
          else
            size=$(stat -c%s target/release/ctx)
          fi
          echo "release binary size: $size bytes"

      - name: Report release binary size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $size = (Get-Item target/release/ctx.exe).Length
          Write-Host "release binary size: $size bytes"

  linux-x11:
    name: Linux X11 clipboard and Xvfb tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip xsel
      - name: Run tests under Xvfb
        run: xvfb-run -a cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Exercise clipboard ownership and no-display failure
        run: xvfb-run -a bash tests/clipboard-x11.sh
